<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="simon.css">
</head>

<body>
    <h1>Simon game</h1>
    <h2 id="high-score"></h2>
    <h3>Press any key to start the game</h3>
    <div class="btn-container">
        <div class="line-1">
            <div class="btn blue" type="button" id="blue">1</div>
            <div class="btn green" type="button" id="green">2</div>
        </div>
        <div class="line-2">
            <div class="btn red" type="button" id="red">3</div>
            <div class="btn brown" type="button" id="brown">4</div>
        </div>
    </div>
    <script src="simon.js"></script>
</body>

</html>
